# Copia fiel de /etc/nginx/sites-available/webrief.app en produccion
# (VPS 199.192.22.74), sincronizada el 2026-09-18. Esto es documentacion:
# scripts/deploy.sh NO toca Nginx. Cambiarlo requiere sudo del owner.
#
# El bloque que sirve el trafico real es el de :443 (generado por Certbot).
# El de :80 solo redirige. Cualquier cambio va en el de :443.
#
# PENDIENTE (auditoria 2026-08, A4): las cabeceras de seguridad / CSP NO estan
# desplegadas. deploy/nginx/security-headers.conf nunca se copio a
# /etc/nginx/snippets/webrief-security-headers.conf ni se incluye en ningun
# bloque, asi que el HTML se sirve sin CSP, X-Frame-Options ni
# X-Content-Type-Options (Express solo cubre /api/*). Al desplegarlo, el include
# va a nivel server Y TAMBIEN dentro de `location = /index.html`, porque sus
# add_header anulan los heredados.

# Purga unica de la cache del navegador (incidente 2026-09-18). Antes del
# no-store, cada navegador guardo copias de index.html por URL; al restaurar
# una pestana descartada, esas copias viejas apuntan a un entry JS que ya no
# existe -> pantalla en blanco. En la primera visita normal sin esta cookie,
# el servidor ordena vaciar la cache HTTP del sitio y deja la cookie para no
# repetirlo. Para forzar otra purga en el futuro: subir el numero en los dos
# map (y en el Set-Cookie).
map $cookie_wb_cache_v $wb_clear_site_data {
    "1"     "";
    default '"cache"';
}
map $cookie_wb_cache_v $wb_cache_cookie {
    "1"     "";
    default "wb_cache_v=1; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
}

server {
    server_name webrief.app www.webrief.app;

    root /var/www/webrief/frontend/dist;
    index index.html;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 2.1 endpoints (added 2026-06-05 for MCP OAuth feature).
    # Regex matches the 8 backend OAuth paths. /oauth/authorize alone (no
    # sub-path) is NOT matched — falls through to the SPA (the consent page).
    location ~ ^/(\.well-known/oauth-|oauth/(register|token|revoke|authorize/(preview|grant))) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html NUNCA se guarda en la cache del navegador (no-store).
    # Con no-cache no alcanza: al restaurar una pestana descartada (o al
    # ir atras/adelante) el navegador usa la copia cacheada SIN revalidar.
    # Como la app navega sin pedir HTML nuevo, esa copia puede ser de un
    # build viejo que apunta a un entry JS que ya no existe -> 404 ->
    # pantalla en blanco sin que corra nada de JS (incidente 2026-09-18).
    #
    # OJO: este add_header anula TODOS los add_header heredados del server.
    # Si algun dia se incluye webrief-security-headers.conf a nivel server,
    # hay que incluirlo TAMBIEN aqui o el HTML principal se queda sin CSP.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        # Vacios (= no se envian) cuando el navegador ya trae la cookie.
        add_header Clear-Site-Data $wb_clear_site_data always;
        add_header Set-Cookie $wb_cache_cookie always;
    }

    # Assets con hash de contenido: inmutables. Un asset faltante debe
    # dar 404 real, NO el fallback SPA: HTML con MIME text/html rompe
    # <script type="module"> antes de que la app pueda reaccionar.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/webrief.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/webrief.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.webrief.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = webrief.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name webrief.app www.webrief.app;
    return 404; # managed by Certbot




}
