server {
    listen 80;
    listen [::]:80;
    server_name webrief.app www.webrief.app;

    root /var/www/webrief/frontend/dist;
    index index.html;

    client_max_body_size 32m;

    # Cabeceras de seguridad + CSP (auditoria 2026-08, A4). El middleware de
    # Express solo cubre /api/*; sin esto el HTML del sitio (incluido /share/:token)
    # se sirve sin ninguna cabecera de seguridad.
    # OJO: si Certbot genero un bloque server para :443, hay que incluirlo TAMBIEN
    # ahi — es el que realmente sirve el trafico en produccion.
    include /etc/nginx/snippets/webrief-security-headers.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
