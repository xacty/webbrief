# Cabeceras de seguridad para el sitio (auditoria 2026-08, hallazgo A4).
#
# POR QUE ESTE ARCHIVO EXISTE APARTE:
#   El middleware de Express (securityHeaders) solo cubre lo que atiende Express,
#   o sea /api/*. El HTML lo sirve Nginx como archivo estatico, asi que la pagina
#   mas expuesta de la app — /share/:token, que renderiza content_html para
#   visitantes anonimos — se servia SIN una sola cabecera de seguridad.
#   Verificado en vivo el 2026-08-17: https://webrief.app/ no devolvia ninguna.
#
# COMO USARLO:
#   Incluir DENTRO del bloque `server` que realmente sirve el sitio (el de :443
#   que administra Certbot, no necesariamente el que esta en webrief.app.conf):
#
#       include /etc/nginx/snippets/webrief-security-headers.conf;
#
#   Luego:  sudo nginx -t  &&  sudo systemctl reload nginx
#
# NOTA sobre `always`: sin ese flag, add_header solo aplica a un subconjunto de
# codigos de estado y las respuestas de error saldrian sin cabeceras.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# HSTS: SOLO tiene sentido en el bloque :443. Si se incluye este archivo en un
# bloque :80, comentar la linea siguiente.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# ---------------------------------------------------------------------------
# Content-Security-Policy
# ---------------------------------------------------------------------------
# Es el control compensatorio del XSS: aunque se cuele HTML malicioso, limita
# que pueda ejecutar y — sobre todo — a donde puede exfiltrar.
#
# Origenes permitidos y por que:
#   script-src   'self' + hash de los DOS scripts inline de index.html: el
#                anti-flash de tema y el guard de arranque (recarga si el JS de
#                entrada no llega a ejecutarse; ver el comentario en
#                frontend/index.html). Se usan hashes en vez de 'unsafe-inline'
#                para no abrir la puerta que el CSP cierra. OJO: si se edita
#                cualquiera de los dos, HAY QUE recalcular su hash o ese script
#                deja de correr (y sin el guard, la app pierde su unica red
#                contra el arranque en blanco). Recalcular AMBOS sobre el build,
#                que es lo que se sirve:
#                  node -e "const f=require('fs'),c=require('crypto');for(const m of f.readFileSync('frontend/dist/index.html','utf8').matchAll(/<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)<\/script>/g))console.log('sha256-'+c.createHash('sha256').update(m[1],'utf8').digest('base64'))"
#   style-src    'unsafe-inline' es necesario: React y TipTap emiten estilos
#                inline (alineacion, color, ancho de columnas de tabla). El riesgo
#                de inline styles es muy inferior al de inline scripts.
#   img-src      blob: para los placeholders de subida en vuelo; data: para
#                imagenes embebidas; ImageKit sirve todos los assets.
#   connect-src  Supabase REST + Realtime (wss). Se usa el ref EXACTO del
#                proyecto de Prod en vez de *.supabase.co a proposito: evita que
#                un XSS exfiltre hacia un proyecto Supabase del atacante.
#   frame-ancestors 'none'  — anti-clickjacking (equivalente moderno de X-Frame-Options).
#   object-src 'none', base-uri 'self', form-action 'self' — cierran vectores clasicos.
#
# OJO al incluir este snippet: en Nginx, un add_header dentro de una location
# anula TODOS los add_header heredados del server. `location = /index.html`
# tiene los suyos (Cache-Control no-store y la purga unica de cache), asi que
# este include tiene que ir TAMBIEN dentro de esa location. Si no, el HTML
# principal (justo el que mas necesita el CSP) se sirve sin cabeceras.
#
# DESPLIEGUE EN DOS PASOS (importante: un CSP mal armado deja la app en blanco):
#   Paso 1 — dejar activa SOLO la linea Report-Only de abajo, recargar Nginx, y
#            navegar la app (login, editor, biblioteca, share publico) mirando la
#            consola del navegador. Report-Only NO bloquea nada: solo reporta.
#   Paso 2 — si la consola no muestra violaciones, comentar la Report-Only y
#            descomentar la de enforce.

set $webrief_csp "default-src 'self'; script-src 'self' 'sha256-dlL2tgUjRyV/3yyGeh2ibeRj054QXDea/AnPY/ZG6P8=' 'sha256-FNZyBUPU1EnFP2aX5HR7a+kb4WkhNAq2kL4ESMSKwc4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ik.imagekit.io https://gmrlhhszrdahcxyoywvt.supabase.co; connect-src 'self' https://gmrlhhszrdahcxyoywvt.supabase.co wss://gmrlhhszrdahcxyoywvt.supabase.co https://ik.imagekit.io; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

# PASO 1 — observar sin bloquear (dejar activa primero):
add_header Content-Security-Policy-Report-Only $webrief_csp always;

# PASO 2 — aplicar de verdad (descomentar y comentar la de arriba):
# add_header Content-Security-Policy $webrief_csp always;
