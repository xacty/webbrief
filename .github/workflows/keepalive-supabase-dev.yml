name: Keepalive Supabase Dev

on:
  schedule:
    - cron: '0 12 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase Dev REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "ERROR: missing SUPABASE_DEV_URL or SUPABASE_DEV_ANON_KEY secret"
            exit 1
          fi
          echo "Pinging ${SUPABASE_URL} at $(date -u)"
          http_code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/companies?select=id&limit=1")
          echo "HTTP ${http_code}"
          if [ "${http_code}" -ge 500 ]; then
            echo "Response body:"
            cat /tmp/body.txt
            exit 1
          fi
          echo "Ping OK — DB reached (any non-5xx counts as DB activity)"
